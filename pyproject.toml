[project]
name = "note2lecture"
version = "0.1.0"
description = "Markdown 与本地资源到中文讲义 PDF 和 LaTeX 源包"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7", "Pillow>=11,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
